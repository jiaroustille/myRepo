---
permalink: /writings/index.html
title: Writings
layout: base.html
col: writings
---

<h1>{{ title }}</h1>
<ul class="h-feed">
  {% for i in collections[col] | reverse %}
  <li>
    <header style="display: flex; align-items: baseline; gap: 1ch;">
      <a href="{{ i.url }}"><h2>{{ i.data.title }}</h2></a>
      <time>{{ i.content | readingTime }}</time>
    </header>
    <p>{{ i.content | genDescription }}</p>
  </li>
  {% endfor %}
</ul>

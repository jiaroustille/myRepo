{% extends "_layouts/base.html" %}

{% block content %}
<article>

  <header>
    <h1>{{ title }}</h1>
    <time>{{ content | readingTime }}</time>
  </header>

  {{ content | safe }}

  <footer>
    {% include "tags.html" %}
    <p class="p-author">{{ author.name }}</p>
    {% include "recomended.html" %}
  </footer>

</article>
{% endblock %}

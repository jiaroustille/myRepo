{% extends "_layouts/base.html" %}

{% block content %}
<article>

  <header>
    <h1>{{ title }}</h1>
    <div style="display: flex; gap: 1ch; align-items: flex-end;">
      {% dateTime pub, upd %}
      <time>{{ content | readingTime }}</time>
    </div>
  </header>

  {{ content | safe }}

  <footer>
    {% include "tags.html" %}
    <p class="p-author">{{ author.name }}</p>
  </footer>

</article>
{% endblock %}
